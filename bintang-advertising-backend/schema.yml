          default: ''
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          nullable: true
        debit_account:
          type: integer
          nullable: true
        kredit_account:
          type: integer
          nullable: true
