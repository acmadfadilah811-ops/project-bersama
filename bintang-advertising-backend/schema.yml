          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        uom_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        uom_harga:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: Harga per satuan yang dipilih
        is_gratis:
          type: boolean
        sale:
          type: integer
        product:
          type: integer
          nullable: true
        variant:
          type: integer
          nullable: true
        promo:
          type: integer
          nullable: true
      required:
      - harga_snapshot
      - id
      - nama_snapshot
      - qty
      - sale
      - subtotal
