        code_range_start:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Batas bawah kode akun yang valid untuk klasifikasi ini.
        code_range_end:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Batas atas kode akun yang valid untuk klasifikasi ini.
      required:
      - account_type
      - id
      - name
