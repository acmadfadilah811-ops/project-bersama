              $ref: '#/components/schemas/CustomUser'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomUser'
          description: ''
  /api/users/me/:
    get:
      operationId: users_me_retrieve
      description: GET /api/users/me/ — PATCH /api/users/me/
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: users_me_partial_update
      description: GET /api/users/me/ — PATCH /api/users/me/
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/online/:
    get:
      operationId: users_online_retrieve
      description: |-
        GET /api/users/online/
        Mengembalikan daftar semua staff dengan status online/offline.
        Hanya untuk Owner & Manager.
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/webhook/evolution/:
    post:
      operationId: webhook_evolution_create
      description: |-
        Webhook endpoint untuk Evolution API. AllowAny.
        Memproses pesan masuk, mendeteksi anti-duplikasi, mengeksekusi logika wa_logic,
        dan mengirim balasan asinkron via REST API Client.
      tags:
      - webhook
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/webhook/fonnte/:
    post:
      operationId: webhook_fonnte_create
      description: |-
        Endpoint webhook dari Fonnte. Tidak pakai JWT (AllowAny).
        Alur: tanya nama → tracking → form order → aturan awal → FAQ → AI
      tags:
      - webhook
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/whatsapp/chats/:
    get:
      operationId: whatsapp_chats_retrieve
      description: |-
        GET /api/whatsapp/chats/
        Retrieves all active chats from the WhatsApp Gateway (Evolution API).
      tags:
      - whatsapp
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/whatsapp/messages/:
    get:
      operationId: whatsapp_messages_retrieve
      description: |-
        GET /api/whatsapp/messages/?number=628xx
        Retrieves message history for a specific number from Evolution API.
      tags:
      - whatsapp
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/whatsapp/send/:
    post:
      operationId: whatsapp_send_create
      description: |-
        POST /api/whatsapp/send/
        Sends a WhatsApp message manually to a contact.
      tags:
      - whatsapp
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/whatsapp/send-media/:
    post:
      operationId: whatsapp_send_media_create
      description: |-
        POST /api/whatsapp/send-media/
        Uploads a file to Cloudflare R2 / Django storage, then sends it via WhatsApp.
        Accepts:
          - file: multipart file
          - number: string
          - caption: string (optional)
      tags:
      - whatsapp
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/whatsapp/status/:
    get:
      operationId: whatsapp_status_retrieve
      description: |-
        GET /api/whatsapp/status/
        Returns the current connection state of the WhatsApp instance
        and a QR code (base64) for scanning if not yet connected.
        Owner/Manager only.
      tags:
      - whatsapp
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
