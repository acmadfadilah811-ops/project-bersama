openapi: 3.0.3
info:
  title: Bintang Advertising CRM API
  version: 1.0.0
  description: Dokumentasi interaktif API Bintang Advertising CRM & Kasir.
paths:
  /api/accounting/account-classifications/:
    get:
      operationId: accounting_account_classifications_list
      description: |-
        GET /api/accounting/account-classifications/

        21 klasifikasi COA (Kas & Bank, Investasi, ..., Pengeluaran Lain) — dipakai
        dropdown "Sub Kategori" di wizard Pengaturan Awal (Tambah Akun). Pengelompokan
        jadi 8 "Kategori" tampilan (Harta Lancar/Tetap/Tak Berwujud/dst) murni di
        frontend (lihat kategoriAkunMap.js) — di sini cukup daftar flat.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountClassificationList'
          description: ''
  /api/accounting/accounts/:
    get:
      operationId: accounting_accounts_list
      description: |-
        GET /api/accounting/accounts/?search=&saldo=&exclude_zero=true&semua_akun=true&period=YYYY-MM&classification=
        POST /api/accounting/accounts/

        Daftar Akun dengan filter (Cari, Jumlah, "Nilai akun bukan 0") dan saldo
        kumulatif per periode (navigasi bulan di halaman Daftar Akun).
        - search: cocokkan ke nomor akun atau nama akun.
        - saldo: hanya akun dengan saldo persis senilai ini.
        - exclude_zero: sembunyikan akun bersaldo 0 ("Nilai akun bukan 0").
        - semua_akun: kalau true, ikutkan akun nonaktif juga (default: aktif saja).
        - period: "YYYY-MM", default bulan berjalan.
        - classification: nama klasifikasi persis (mis. "Kas & Bank") — dipakai
          ulang endpoint ini untuk "List Kas & Bank", bukan bikin view terpisah.

        POST — "Tambah Akun" cepat dari wizard Pengaturan Awal (dan dipakai ulang
        kalau nanti Daftar Akun butuh tambah akun manual juga).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountListList'
          description: ''
    post:
      operationId: accounting_accounts_create
      description: |-
        GET /api/accounting/accounts/?search=&saldo=&exclude_zero=true&semua_akun=true&period=YYYY-MM&classification=
        POST /api/accounting/accounts/

        Daftar Akun dengan filter (Cari, Jumlah, "Nilai akun bukan 0") dan saldo
        kumulatif per periode (navigasi bulan di halaman Daftar Akun).
        - search: cocokkan ke nomor akun atau nama akun.
        - saldo: hanya akun dengan saldo persis senilai ini.
        - exclude_zero: sembunyikan akun bersaldo 0 ("Nilai akun bukan 0").
        - semua_akun: kalau true, ikutkan akun nonaktif juga (default: aktif saja).
        - period: "YYYY-MM", default bulan berjalan.
        - classification: nama klasifikasi persis (mis. "Kas & Bank") — dipakai
          ulang endpoint ini untuk "List Kas & Bank", bukan bikin view terpisah.

        POST — "Tambah Akun" cepat dari wizard Pengaturan Awal (dan dipakai ulang
        kalau nanti Daftar Akun butuh tambah akun manual juga).
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreate'
          description: ''
  /api/accounting/accounts/{id}/:
    get:
      operationId: accounting_accounts_retrieve
      description: |-
        GET /api/accounting/accounts/<id>/
        PUT/PATCH /api/accounting/accounts/<id>/
        DELETE /api/accounting/accounts/<id>/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreate'
          description: ''
    put:
      operationId: accounting_accounts_update
      description: |-
        GET /api/accounting/accounts/<id>/
        PUT/PATCH /api/accounting/accounts/<id>/
        DELETE /api/accounting/accounts/<id>/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreate'
          description: ''
    patch:
      operationId: accounting_accounts_partial_update
      description: |-
        GET /api/accounting/accounts/<id>/
        PUT/PATCH /api/accounting/accounts/<id>/
        DELETE /api/accounting/accounts/<id>/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountCreate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreate'
          description: ''
    delete:
      operationId: accounting_accounts_destroy
      description: |-
        GET /api/accounting/accounts/<id>/
        PUT/PATCH /api/accounting/accounts/<id>/
        DELETE /api/accounting/accounts/<id>/
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/accounting/accounts/copy-store/:
    post:
      operationId: accounting_accounts_copy_store_create
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/accounts/import/commit/:
    post:
      operationId: accounting_accounts_import_commit_create
      description: |-
        POST /api/accounting/accounts/import/commit/

        Langkah 2 dari 2: body = {"entries": [...]} persis bentuk `entries` dari
        respons /import/preview/. Entry dengan is_valid=false dilewati.
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/accounts/import/guide/:
    get:
      operationId: accounting_accounts_import_guide_retrieve
      description: |-
        GET /api/accounting/accounts/import/guide/

        Panduan rentang kode akun per klasifikasi (account_group/first_no/last_no),
        dibaca langsung dari AccountClassification — selalu sinkron dengan validasi
        import & Account.clean(). Format & urutan (per code_range_start menaik)
        meniru file panduan resmi Olsera (templateGuideAccount, sheet "ruleAccountNo").
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/accounts/import/preview/:
    post:
      operationId: accounting_accounts_import_preview_create
      description: |-
        POST /api/accounting/accounts/import/preview/  (multipart, field 'file')

        Langkah 1 dari 2 (baca dulu, proses belakangan — seperti import Jurnal
        Umum): parse CSV, validasi tiap baris (kode wajib angka, masuk rentang
        klasifikasi, belum terdaftar), TIDAK menyimpan apa pun.
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/accounts/import/template/:
    get:
      operationId: accounting_accounts_import_template_retrieve
      description: |-
        GET /api/accounting/accounts/import/template/

        Template CSV persis format resmi Olsera: cuma account_name + account_no.
        Klasifikasi & is_contra TIDAK diminta di sini — di-derive otomatis saat
        preview dari rentang kode (lihat AccountImportGuideView di bawah).
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/assets/:
    get:
      operationId: accounting_assets_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFixedAssetReadList'
          description: ''
    post:
      operationId: accounting_assets_create
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FixedAssetCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FixedAssetCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAssetCreate'
          description: ''
  /api/accounting/assets/{id}/:
    get:
      operationId: accounting_assets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAssetRead'
          description: ''
    put:
      operationId: accounting_assets_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedAssetUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FixedAssetUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FixedAssetUpdate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAssetUpdate'
          description: ''
    patch:
      operationId: accounting_assets_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFixedAssetUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFixedAssetUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFixedAssetUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedAssetUpdate'
          description: ''
  /api/accounting/assets/export/:
    get:
      operationId: accounting_assets_export_retrieve
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/assets/import/commit/:
    post:
      operationId: accounting_assets_import_commit_create
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/assets/import/preview/:
    post:
      operationId: accounting_assets_import_preview_create
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/assets/import/template/:
    get:
      operationId: accounting_assets_import_template_retrieve
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/bank-reconciliation/:
    get:
      operationId: accounting_bank_reconciliation_retrieve
      description: |-
        GET /api/accounting/bank-reconciliation/?account=<id>&date_from=&date_to=

        Return 2 himpunan data terpisah, masing-masing sudah difilter "belum
        reconciled" di level query (bukan flag mentah yang dikira-kira frontend):
        - unreconciled_internal: baris jurnal/buku besar yang belum terpasang ke
          bank statement manapun.
        - unreconciled_bank_statement: baris tabel staging hasil import CSV yang
          belum direkonsiliasi (status=Pending).

        Untuk 1 akun + rentang tanggal (default hari ini). Belum ada auto-suggest
        matching — akun 23000/23500 bukan akun kas/bank asli, arah pencocokannya
        belum tentu sama seperti Kas/Bank, jadi belum dibangun sampai ada contoh nyata.
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/bank-reconciliation/match/:
    post:
      operationId: accounting_bank_reconciliation_match_create
      description: |-
        POST /api/accounting/bank-reconciliation/match/
        body: {"bank_statement_line": <id>, "journal_entry_line": <id>}

        Konfirmasi 1 baris Bank Statement cocok dengan 1 baris Journal Entry —
        tandai Reconciled. Manual (dipilih user), bukan auto-match.
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/bank-statement/:
    get:
      operationId: accounting_bank_statement_list
      description: |-
        GET /api/accounting/bank-statement/?account=<id>&date_from=&date_to=

        List Bank Statement (default rentang bulan berjalan), dipaginasi.
        - account: filter ke 1 akun (opsional — "Semua Data" kalau kosong).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBankStatementLineList'
          description: ''
  /api/accounting/bank-statement/import/commit/:
    post:
      operationId: accounting_bank_statement_import_commit_create
      description: |-
        POST /api/accounting/bank-statement/import/commit/
        body: {"account": <id>, "rows": [...]}  (bentuk `rows` dari respons preview)

        Langkah 2 dari 2: simpan baris valid ke BankStatementLine (status Pending).
        Ini BUKAN posting ke Journal Entry — menunggu diproses di Rekonsiliasi Bank.
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/bank-statement/import/preview/:
    post:
      operationId: accounting_bank_statement_import_preview_create
      description: |-
        POST /api/accounting/bank-statement/import/preview/  (multipart: file, account)

        Langkah 1 dari 2: parse CSV, validasi per baris, TIDAK menyimpan apa pun.
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/cash-bank-accounts/:
    get:
      operationId: accounting_cash_bank_accounts_list
      description: GET /api/accounting/cash-bank-accounts/ — daftar akun terkurasi
        untuk dropdown Bank Statement.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCashBankAccountList'
          description: ''
  /api/accounting/close-period/:
    post:
      operationId: accounting_close_period_create
      description: POST /api/accounting/close-period/ atau POST /api/accounting/periods/<pk>/close/
        — tutup buku / kunci periode akuntansi (Owner/Manager saja).
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/departments/:
    get:
      operationId: accounting_departments_retrieve
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/journal-entries/:
    get:
      operationId: accounting_journal_entries_list
      description: |-
        GET  /api/accounting/journal-entries/?date_from=&date_to=&search=
        POST /api/accounting/journal-entries/

        Jurnal Umum: list (default rentang hari ini, sama seperti default Olsera)
        + search No. Transaksi (entry_number), dan create — 1 endpoint melayani
        Form Jurnal Tunggal (Advance/Basic) dan Form Multi Jurnal sekaligus, lihat
        JournalEntryCreateSerializer.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJournalEntryListList'
          description: ''
    post:
      operationId: accounting_journal_entries_create
      description: |-
        GET  /api/accounting/journal-entries/?date_from=&date_to=&search=
        POST /api/accounting/journal-entries/

        Jurnal Umum: list (default rentang hari ini, sama seperti default Olsera)
        + search No. Transaksi (entry_number), dan create — 1 endpoint melayani
        Form Jurnal Tunggal (Advance/Basic) dan Form Multi Jurnal sekaligus, lihat
        JournalEntryCreateSerializer.
      tags:
      - accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JournalEntryCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JournalEntryCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryCreate'
          description: ''
  /api/accounting/journal-entries/{entry_number}/:
    get:
      operationId: accounting_journal_entries_retrieve
      description: |-
        GET /api/accounting/journal-entries/<entry_number>/  â€” detail pasangan jurnal
        DELETE /api/accounting/journal-entries/<entry_number>/
      parameters:
      - in: path
        name: entry_number
        schema:
          type: string
        required: true
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: accounting_journal_entries_destroy
      description: |-
        GET /api/accounting/journal-entries/<entry_number>/  â€” detail pasangan jurnal
        DELETE /api/accounting/journal-entries/<entry_number>/
      parameters:
      - in: path
        name: entry_number
        schema:
          type: string
        required: true
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/accounting/journal-entries/{entry_number}/export/:
    get:
      operationId: accounting_journal_entries_export_retrieve_2
      description: |-
        GET /api/accounting/journal-entries/<entry_number>/export/

        Export Excel utk 1 Journal Entry saja (tombol "Cetak PDF" per-baris di
        list Jurnal Umum — labelnya "PDF" tapi isinya Excel, reuse
        build_journal_export() yang sama dengan JournalExportView, cuma daftar
        entry-nya cuma 1).
      parameters:
      - in: path
        name: entry_number
        schema:
          type: string
        required: true
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/journal-entries/export/:
    get:
      operationId: accounting_journal_entries_export_retrieve
      description: |-
        GET /api/accounting/journal-entries/export/?date_from=&date_to=&search=

        Export Excel — pakai filter yang sama persis dengan List (default hari
        ini), jadi hasil export selalu cocok dengan apa yang lagi tampil di layar.
        1 baris Excel per JournalEntryLine (Akun, Debit, Kredit, dst).
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/journal-entries/import/commit/:
    post:
      operationId: accounting_journal_entries_import_commit_create
      description: |-
        POST /api/accounting/journal-entries/import/commit/

        Langkah 2 dari 2: body = {"entries": [...]} persis bentuk `entries` dari
        respons /import/preview/ (biasanya sudah ditinjau/dikoreksi user di
        frontend). Entry dengan is_valid=false dilewati, tidak diproses.
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/journal-entries/import/preview/:
    post:
      operationId: accounting_journal_entries_import_preview_create
      description: |-
        POST /api/accounting/journal-entries/import/preview/  (multipart, field 'file')

        Langkah 1 dari 2 (baca dulu, proses belakangan — seperti import produk):
        parse CSV, kelompokkan baris jadi calon Journal Entry, validasi (akun ada,
        balance, dll), TIDAK menyimpan apa pun. Hasilnya ditinjau user, lalu
        dikirim balik ke /import/commit/ (bukan upload ulang file-nya).
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/journal-templates/:
    get:
      operationId: accounting_journal_templates_retrieve
      tags:
      - accounting
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounting/ledger/:
    get:
