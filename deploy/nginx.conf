map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Resolver Docker bawaan — WAJIB supaya proxy_pass ke "backend" (dan
    # "frontend") di-resolve ulang tiap request lewat variabel, bukan sekali
    # di startup. Tanpa ini nginx cache 1 IP saja dan skip replica lain.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location /admin/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
    }

    # Prefix sensitif (kontrak HR, PKWT, lampiran transaksi/pembelian,
    # dokumen catatan pelanggan) TIDAK boleh diakses publik langsung lewat
    # /media/ - hanya lewat /api/media-protected/<token>/ (wajib login,
    # kedaluwarsa 10 menit, lihat api/protected_media.py). Location prefix
    # yang lebih panjang ini menang otomatis di atas /media/ di bawah,
    # terlepas urutan penulisan.
    location /media/kontrak/ { return 403; }
    location /media/dokumen_hr/ { return 403; }
    location /media/customer_notes/ { return 403; }
    location /media/cash_transactions/ { return 403; }
    location /media/purchase_attachments/ { return 403; }

    # Sisanya (foto produk/kategori/varian/paket, avatar) tetap publik -
    # dipakai bot WA katalog & tampilan lain tanpa login.
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 7d;
    }

    # Target X-Accel-Redirect dari /api/media-protected/<token>/. `internal`
    # bikin nginx 404 kalau diakses langsung dari luar - hanya bisa dicapai
    # lewat redirect internal dari backend setelah lolos cek IsAuthenticated
    # + signature token.
    location /protected-media-internal/ {
        internal;
        alias /srv/media/;
    }

    location / {
        set $frontend_upstream http://frontend:8080;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
